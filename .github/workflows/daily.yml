name: daily-brief

on:
  schedule:
    - cron: '0 23 * * *'   # UTC 23:00 = 北京时间早上 07:00（GitHub 定时可能有十几分钟延迟）
  workflow_dispatch:        # 允许在 Actions 页面手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 安装 web 依赖（导出偏好与同步数据库共用）
        run: npm ci
        working-directory: web
      - name: 导出反馈偏好（用于偏好搜索）
        continue-on-error: true   # 没有反馈或读库失败时，brief.mjs 会沿用固定搜索词
        run: npm run export:preferences
        working-directory: web
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
      - run: node brief.mjs
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      - name: 同步最新数据到云端应用数据库（Turso）
        continue-on-error: true   # 即使这步失败，静态简报照常发布
        run: npm run seed:cloud
        working-directory: web
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
